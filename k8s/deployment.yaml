apiVersion: apps/v1
kind: Deployment
metadata:
  name: intellifleet-core-api
  namespace: default

spec:
  replicas: 1

  selector:
    matchLabels:
      app: intellifleet-core-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # ✅ don't kill old until new is ready
      maxSurge: 1           # ✅ create 1 extra pod during update

  template:
    metadata:
      labels:
        app: intellifleet-core-api

    spec:
      containers:
        - name: intellifleet-core-api
          image: intellifleet-core-api-image:__VERSION__   # ✅ NO latest
          imagePullPolicy: Always                         # ✅ always pull new

          ports:
            - containerPort: 8086

          # ✅ CRITICAL FIX (your main issue)
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 25
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - mountPath: /opt/logs/intellifleet-core-api
              name: log-volume

      volumes:
        - name: log-volume
          hostPath:
            path: /opt/intellifleet/apps/intellifleet-core-api/logs
            type: DirectoryOrCreate